name: Update League Data

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write           # needed to push the updated JSON back

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run scraper
        run: node scripts/scrape-league.js

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season-2025-26.json
          if git diff --cached --quiet; then
            echo "No changes — data is already up to date."
          else
            DATE=$(date -u '+%Y-%m-%d')
            git commit -m "chore: update league data $DATE"
            git push
          fi
